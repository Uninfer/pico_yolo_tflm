name: Bug report
description: Report build, camera, display, or inference issues
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, compiler/Pico SDK versions, board and modules, clocks, and wiring.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List minimal reproduction steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Build or serial logs
      description: Include initialization messages and VIDEO/INFER logs. Remove personal information and credentials.
      render: text
