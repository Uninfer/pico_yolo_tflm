name: Feature request
description: Suggest improvements to hardware support, inference, or development workflows
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the use case and current limitations.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Explain the solution, alternatives, and expected impact on RAM, flash, or performance.
    validations:
      required: true
